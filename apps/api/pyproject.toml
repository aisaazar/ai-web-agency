[project]
name = "agency"
version = "0.1.0"
description = "AI Web Agency platform app (domain, services, providers, api)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "argon2-cffi>=23.1,<26",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
